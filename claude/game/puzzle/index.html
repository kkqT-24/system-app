<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#040410" />
<title>Shadow Runes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="puzzle.css?v=2" />
</head>
<body>
<div id="app">
  <header id="top">
    <div class="stat"><span>FLOOR</span><b id="hFloor">1</b></div>
    <div class="stat"><span>WAVE</span><b id="hWave">1/3</b></div>
    <div class="stat moves"><span>MOVES</span><b id="hMoves">0</b></div>
    <button class="iconbtn" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  </header>
  <main id="stage"><div id="frame"><canvas id="cv"></canvas></div></main>
  <footer id="bar">
    <button id="bArise" class="arise"><i id="ariseFill"></i><span class="lbl">ARISE</span><span class="pct" id="arisePct">0%</span></button>
  </footer>
</div>
<div id="overlay" class="hide"></div>
<script src="puzzle.js?v=2"></script>
</body>
</html>
